name: Публикация новостей

on:
  schedule:
    # каждый час в 5-ю минуту (сдвиг от ровного часа — так надёжнее с
    # очередями GitHub Actions, которые иногда задерживают запуск на ":00")
    - cron: "5 * * * *"
  workflow_dispatch: {}  # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write  # нужно, чтобы commit-ить обновлённый state/posted.json

concurrency:
  group: publish
  cancel-in-progress: false  # не обрывать текущий запуск, если следующий подоспел

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить пайплайн
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Закоммитить обновлённое состояние (posted.json)
        run: |
          git config user.name "talkuyut-dengi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || git commit -m "chore: обновить state/posted.json [skip ci]"
          git push
