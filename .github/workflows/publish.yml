name: Публикация новостей

on:
  schedule:
    # каждые ~15 минут, но НЕ на круглых отметках (:00/:15/:30/:45) — именно
    # там у GitHub Actions самая большая очередь scheduled-запусков, и
    # реальная задержка срабатывания больше всего. Смещённые минуты дают тот
    # же интервал, но вне пиковых слотов. Публичность/приватность репозитория
    # на приоритет очереди не влияет — только на лимит Actions-минут.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write  # нужно, чтобы commit-ить обновлённый state/posted.json

concurrency:
  group: publish
  cancel-in-progress: false  # не обрывать текущий запуск, если следующий подоспел

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить пайплайн
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Уведомить о сбое
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID не задан — пропускаем личное уведомление"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -d text="⚠️ talkuyut-dengi: пайплайн упал с ошибкой. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Закоммитить обновлённое состояние (posted.json)
        run: |
          git config user.name "talkuyut-dengi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || git commit -m "chore: обновить state/posted.json [skip ci]"
          git push
