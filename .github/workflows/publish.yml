name: Публикация новостей

on:
  # Основное расписание больше НЕ живёт в GitHub Actions. Встроенный
  # `schedule:` оказался ненадёжен не просто задержками — он может целиком
  # пропускать срабатывания под нагрузкой (без повтора), что на практике
  # превращало "каждые 15 минут" в "раз в несколько часов, когда повезёт".
  # Теперь основное расписание держит внешний Cloudflare Worker (Cron
  # Trigger, отдельно от GitHub), который каждые 15 минут дёргает
  # workflow_dispatch через GitHub API.
  workflow_dispatch: {}

  # Резервный, редкий cron остаётся здесь намеренно — как страховка на
  # случай, если сам внешний будильник сломается (протухший PAT-токен,
  # проблема на стороне Cloudflare и т.п.). Без него поломка Cloudflare
  # означала бы ПОЛНУЮ и абсолютно тихую остановку публикаций — ни одного
  # запуска, а значит и "Уведомить о сбое" никогда не сработает, потому что
  # сработать не на чем. Раз в 2 часа даже при обычной для `schedule:`
  # ненадёжности рано или поздно да сработает и вернёт систему в рабочее
  # состояние, пока не найдётся время починить основной путь.
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write  # нужно, чтобы commit-ить обновлённый state/posted.json

concurrency:
  group: publish
  cancel-in-progress: false  # не обрывать текущий запуск, если следующий подоспел

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить пайплайн
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Уведомить о сбое
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID не задан — пропускаем личное уведомление"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -d text="⚠️ talkuyut-dengi: пайплайн упал с ошибкой. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Закоммитить обновлённое состояние (posted.json)
        run: |
          git config user.name "talkuyut-dengi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || git commit -m "chore: обновить state/posted.json [skip ci]"
          git push
