name: Публикация новостей

on:
  # Основное расписание больше НЕ живёт в GitHub Actions. Встроенный
  # `schedule:` оказался ненадёжен не просто задержками — он может целиком
  # пропускать срабатывания под нагрузкой (без повтора), что на практике
  # превращало "каждые 15 минут" в "раз в несколько часов, когда повезёт".
  # Теперь основное расписание держит внешний Cloudflare Worker (Cron
  # Trigger, отдельно от GitHub), который каждые 15 минут дёргает
  # workflow_dispatch через GitHub API.
  workflow_dispatch: {}

  # Резервный, редкий cron остаётся здесь намеренно — как страховка на
  # случай, если сам внешний будильник сломается (протухший PAT-токен,
  # проблема на стороне Cloudflare и т.п.). Без него поломка Cloudflare
  # означала бы ПОЛНУЮ и абсолютно тихую остановку публикаций — ни одного
  # запуска, а значит и "Уведомить о сбое" никогда не сработает, потому что
  # сработать не на чем. Раз в 2 часа даже при обычной для `schedule:`
  # ненадёжности рано или поздно да сработает и вернёт систему в рабочее
  # состояние, пока не найдётся время починить основной путь.
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write  # нужно, чтобы commit-ить обновлённый state/posted.json

concurrency:
  group: publish
  # Было false ("не обрывать текущий запуск, если следующий подоспел"). Это
  # привело к полному дедлоку 13.09.2026: запуск #705 завис в статусе Queued
  # (GitHub так и не выдал раннер — "Waiting for a runner to pick up this
  # job..."), а поскольку в группе держится только ОДИН ожидающий запуск,
  # каждый следующий крон-запуск вставал за ним в очередь и отменялся
  # пришедшим следом ("Canceling since a higher priority waiting request for
  # publish exists"). Публикации встали больше чем на 3 часа и молча — сами
  # отменённые раны не стартуют, поэтому шаг "Уведомить о сбое" сработать не
  # может (cancelled — не failure).
  #
  # true означает: новый запуск отменяет предыдущий, если тот всё ещё жив.
  # Нормальный прогон занимает 20-60 секунд при интервале в 15 минут, так что
  # "всё ещё жив через 15 минут" = ран сломан/завис, и обрывать его как раз и
  # нужно. Риск обрыва посреди работы (пост уже ушёл в Telegram, а state не
  # закоммичен → дубль на следующем ране) закрыт шагом коммита с if: always()
  # ниже — always() выполняется и при отмене job тоже.
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Нормальный прогон — 20-60 секунд (например, #704 отработал за 18 с).
    # 10 минут — это заведомо "что-то зависло" (подвисший запрос к источнику
    # или к Anthropic). Лучше упасть по таймауту, чем занимать concurrency-
    # группу: упавший по таймауту job всё равно дойдёт до шага коммита
    # состояния ниже, потому что там if: always(). На запуски, застрявшие в
    # очереди ДО выдачи раннера (статус Queued), этот таймаут не действует —
    # от них защищает cancel-in-progress: true выше.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить пайплайн
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Закоммитить обновлённое состояние
        # Раньше это был голый `git push` — если два запуска пересекались по
        # времени (например, сразу после деплоя новой версии), проигравший
        # получал "rejected (fetch first)" и падал, а Telegram-пост к этому
        # моменту уже уходил (это делает main.py раньше) — просто его id не
        # попадал в posted.json, и следующий запуск публиковал его ПОВТОРНО.
        # Именно так возник дубль поста про Texas Stock Exchange в ночь на
        # 10.09.2026. scripts/commit_state.py при неудачном push подтягивает
        # свежий origin, сливает state-файлы по смыслу (объединяет id/записи,
        # а не берёт чью-то версию целиком) и пробует снова, до 5 раз.
        #
        # if: always() — намеренно, а не просто "если предыдущий шаг успешен"
        # (это поведение по умолчанию без if:). main.py может упасть с exit 1
        # целиком (например, кончился баланс Anthropic и ВСЕ новые заголовки
        # не перевелись), но при этом успеть посчитать состояние, не зависящее
        # от перевода — прежде всего отметку часа-флаша дайджеста в
        # maybe_flush_digest(). Без always() эта отметка тихо терялась при
        # каждом таком сбое (обнаружено 12.09.2026 — час-флаш 21:00 МСК так и
        # не зафиксировался при простое баланса), и при повторении сценария с
        # НЕпустой очередью дайджеста это грозило повторной отправкой одного и
        # того же дайджеста на следующем ране в тот же час.
        if: always()
        run: |
          git config user.name "talkuyut-dengi-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/commit_state.py main

      - name: Уведомить о сбое
        # Стоит ПОСЛЕДНИМ шагом намеренно: если поставить его раньше шага
        # коммита (как было раньше), падение именно коммита/push осталось бы
        # без уведомления — job на GitHub помечался бы failed, а в личку
        # ничего бы не прилетало (ровно это и произошло в ночь на 10.09.2026).
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID не задан — пропускаем личное уведомление"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -d text="⚠️ talkuyut-dengi: пайплайн упал с ошибкой. Лог: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
